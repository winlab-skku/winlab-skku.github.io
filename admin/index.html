<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WIn Lab — Admin</title>
<link rel="icon" href="../assets/favicon.svg">
<style>
  :root { --ink:#1c1f21; --ink2:#545b60; --ink3:#8d949a; --rule:#e5e8e8; --panel:#f2f4f4; --accent:#0f766e; --accent2:#5eead4; --danger:#b42318; }
  * { box-sizing:border-box; }
  body { margin:0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:#fff; }
  header { background:var(--ink); color:#fff; padding:0 24px; height:56px; display:flex; align-items:center; gap:24px; position:sticky; top:0; z-index:10; }
  header b { color:var(--accent2); font-size:17px; white-space:nowrap; }
  header > * { flex-shrink:0; }
  header #root { flex-shrink:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:rtl; text-align:left; }
  header a, .hbtn { white-space:nowrap; }
  header span { opacity:.6; font-size:13px; }
  header .spacer { flex:1; }
  header a { color:#fff; opacity:.8; text-decoration:none; font-size:14px; }
  header a:hover { opacity:1; }
  .layout { display:grid; grid-template-columns:200px 1fr; min-height:calc(100vh - 56px); }
  nav { border-right:1px solid var(--rule); padding:16px 0; background:#fafbfb; }
  nav button { display:block; width:100%; text-align:left; padding:10px 22px; border:0; background:none; font:inherit; color:var(--ink2); cursor:pointer; }
  nav button.on { color:var(--accent); font-weight:600; background:#fff; border-right:3px solid var(--accent); }
  main { padding:28px 36px 120px; max-width:1000px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .hint { color:var(--ink3); font-size:13px; margin:0 0 20px; }
  h2 { font-size:15px; margin:28px 0 10px; color:var(--accent); }
  .card { border:1px solid var(--rule); border-radius:8px; padding:14px 16px; margin-bottom:10px; background:#fff; }
  .card.prof { background:var(--panel); }
  .row { display:grid; grid-template-columns:130px 1fr; gap:8px 12px; align-items:start; margin:6px 0; }
  .row label { color:var(--ink3); font-size:13px; padding-top:7px; }
  input[type=text], textarea, select { width:100%; padding:6px 9px; border:1px solid #cfd5d5; border-radius:5px; font:inherit; font-size:14px; background:#fff; }
  textarea { min-height:60px; resize:vertical; }
  input:focus, textarea:focus, select:focus { outline:2px solid var(--accent2); border-color:var(--accent); }
  .tools { display:flex; gap:6px; justify-content:flex-end; margin-top:8px; }
  .tools button, .btn { padding:5px 11px; border:1px solid #cfd5d5; border-radius:5px; background:#fff; font:inherit; font-size:13px; cursor:pointer; color:var(--ink2); }
  .tools button:hover, .btn:hover { border-color:var(--ink2); color:var(--ink); }
  .tools .del { color:var(--danger); }
  .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  .btn.primary:hover { background:#0b5f58; color:#fff; }
  .btn.add { margin:4px 0 12px; }
  .photo { display:flex; gap:12px; align-items:center; }
  .photo img { width:60px; height:80px; object-fit:cover; background:var(--panel); border-radius:4px; }
  .photo .none { width:60px; height:80px; background:var(--panel); border-radius:4px; display:grid; place-items:center; color:var(--ink3); font-size:11px; }
  .sub { border-left:2px solid var(--rule); padding-left:12px; margin:4px 0; }
  .sub .row { grid-template-columns:150px 1fr auto; }
  .pubsec { margin-bottom:26px; }
  .pubsec h2 { display:flex; align-items:center; gap:10px; }
  .pubsec h2 small { color:var(--ink3); font-weight:400; }
  .pub .row { grid-template-columns:70px 1fr; }
  .bar { position:fixed; left:200px; right:0; bottom:0; background:#fff; border-top:1px solid var(--rule); padding:12px 36px; display:flex; gap:10px; align-items:center; }
  .bar .status { color:var(--ink3); font-size:13px; flex:1; }
  .bar .status.err { color:var(--danger); }
  .bar .status.ok { color:var(--accent); }
  .files { background:var(--panel); border-radius:8px; padding:14px 18px; font-family:ui-monospace, Menlo, Consolas, monospace; font-size:13px; }
  .files li { padding:2px 0; }
  .dirty header b::after { content:" •"; color:#fbbf24; }
  .chip { font-size:12px; padding:3px 9px; border-radius:999px; border:1px solid rgba(255,255,255,.25); opacity:1 !important; white-space:nowrap; }
  .chip.ok { color:var(--accent2); border-color:rgba(94,234,212,.5); }
  .chip.warn { color:#fbbf24; border-color:rgba(251,191,36,.55); }
  .chip.off { color:#c3c8cc; }
  .hbtn { background:none; border:1px solid rgba(255,255,255,.3); color:#fff; border-radius:5px; padding:4px 10px; font:inherit; font-size:13px; cursor:pointer; }
  .hbtn:hover { border-color:#fff; }
  .btn.deploy { background:var(--ink); color:#fff; border-color:var(--ink); font-weight:600; }
  .btn.deploy:hover { background:#000; color:#fff; }
  .btn:disabled { opacity:.5; cursor:default; }
  .note { border:1px solid var(--rule); border-left:4px solid var(--accent); border-radius:8px; padding:12px 16px; margin:0 0 14px; background:#fff; position:relative; }
  .note.warn { border-left-color:#d97706; background:#fffbeb; }
  .note.err { border-left-color:var(--danger); background:#fef3f2; }
  .note.info { border-left-color:var(--accent); background:#f0fdfa; }
  .note > b { display:block; margin-bottom:4px; }
  .note p { margin:4px 0; font-size:14px; }
  .note .x { position:absolute; top:6px; right:8px; border:0; background:none; font-size:18px; color:var(--ink3); cursor:pointer; }
  .note .acts { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .flist { margin:6px 0 0; padding:0; list-style:none; font-family:ui-monospace, Menlo, Consolas, monospace; font-size:12.5px; max-height:220px; overflow:auto; }
  .flist li { padding:1px 0; }
  .flist .k { display:inline-block; min-width:62px; color:var(--ink3); }
  .steps { margin:8px 0 0 18px; padding:0; font-size:14px; }
  .steps li { margin:4px 0; }
  .dlist { margin:4px 0 12px; padding:0; list-style:none; font-size:14px; }
  .dlist > li { padding:5px 0; border-bottom:1px solid var(--rule); display:grid; grid-template-columns:170px 1fr; column-gap:12px; }
  .dlist > li:last-child { border-bottom:0; }
  .dlist .k { font-size:12px; color:var(--ink3); padding-top:2px; grid-row:span 4; }
  .dlist .chg { grid-column:2; font-size:12.5px; color:var(--ink2); margin-top:2px; }
  @media (max-width:800px) { .dlist > li { grid-template-columns:1fr; } .dlist .chg { grid-column:1; } }
  .dlist .chg s { color:var(--ink3); }
  .dhead { font-size:14px; margin:14px 0 2px; }
  code { font-size:12.5px; background:var(--panel); padding:1px 5px; border-radius:4px; }
  @media (max-width:800px) { header { gap:12px; padding:0 14px; } header #root, header > span:nth-child(2), .bar .status { display:none; } .layout { grid-template-columns:1fr; } nav { display:flex; overflow-x:auto; } nav button.on { border-right:0; border-bottom:3px solid var(--accent); } .bar { left:0; } main { padding:20px; } .row { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <b>WIn Lab</b><span>Admin</span>
  <span id="root" title="" style="opacity:.9;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;margin-left:4px;padding:3px 8px;border:1px solid rgba(255,255,255,.25);border-radius:4px"></span>
  <span id="sync" class="chip off">GitHub 확인 중…</span>
  <div class="spacer"></div>
  <button class="hbtn" id="pull" title="GitHub에 올라온 최신 버전을 이 폴더로 받습니다">최신 받기</button>
  <a href="/" target="_blank">사이트 미리보기 ↗</a>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"><div id="notice"></div><div id="content"></div></main>
</div>
<div class="bar">
  <div class="status" id="status">불러오는 중…</div>
  <button class="btn" id="reload">되돌리기</button>
  <button class="btn primary" id="save">저장 + 빌드</button>
  <button class="btn deploy" id="deploy">GitHub에 배포</button>
</div>

<script>
let D = null, S = null, dirty = false, tab = 'members';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const TABS = [['members','Members'],['pubs','Publications'],['research','Research areas'],['news','News'],['site','Site text & settings'],['github','GitHub 배포']];

function setStatus(msg, cls='') { const s = $('#status'); s.textContent = msg; s.className = 'status ' + cls; }
function markDirty() { dirty = true; document.body.classList.add('dirty'); setStatus('저장되지 않은 변경사항이 있습니다.'); }
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

async function api(path, body) {
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)} : {});
  const j = await r.json();
  if (!j.ok && body) { const e = new Error(j.error || 'error'); e.data = j; throw e; }
  return j;
}
async function load() {
  D = await api('/api/data'); dirty = false; document.body.classList.remove('dirty');
  $('#root').textContent = '\u200e편집 중: ' + D.root + '\u200e'; $('#root').title = D.root; document.title = 'WIn Lab Admin — ' + D.root.split(/[\\/]/).slice(-1)[0];
  render(); setStatus('불러왔습니다.');
}

// ---------- generic editors
function field(obj, key, label, type='text', extra='') {
  const v = esc(obj[key]);
  const ctl = type === 'textarea' ? `<textarea data-k="${key}">${v}</textarea>` : `<input type="text" data-k="${key}" value="${v}" ${extra}>`;
  return `<div class="row"><label>${label}</label>${ctl}</div>`;
}
function bindFields(el, obj) {
  el.querySelectorAll('[data-k]').forEach(i => i.addEventListener('input', () => { obj[i.dataset.k] = i.value; markDirty(); }));
}
function listTools(arr, i) {
  return `<div class="tools"><button data-act="up" ${i===0?'disabled':''}>↑</button><button data-act="down" ${i===arr.length-1?'disabled':''}>↓</button><button data-act="del" class="del">삭제</button></div>`;
}
function bindTools(el, arr, i, rerender) {
  el.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
    const a = b.dataset.act;
    if (a === 'del') { if (!confirm('삭제할까요?')) return; arr.splice(i, 1); }
    if (a === 'up') [arr[i-1], arr[i]] = [arr[i], arr[i-1]];
    if (a === 'down') [arr[i+1], arr[i]] = [arr[i], arr[i+1]];
    markDirty(); rerender();
  }));
}
function listEditor(container, arr, fields, blank, opts={}) {
  const draw = () => {
    container.innerHTML = '';
    arr.forEach((it, i) => {
      const card = document.createElement('div'); card.className = 'card';
      card.innerHTML = (opts.extra ? opts.extra(it) : '') + fields.map(f => field(it, ...f)).join('') + listTools(arr, i);
      bindFields(card, it); bindTools(card, arr, i, draw);
      if (opts.after) opts.after(card, it, draw);
      container.appendChild(card);
    });
    const add = document.createElement('button'); add.className = 'btn add'; add.textContent = '+ 추가';
    add.onclick = () => { arr.push(JSON.parse(JSON.stringify(blank))); markDirty(); draw(); container.lastElementChild.previousElementSibling.querySelector('input,textarea')?.focus(); };
    container.appendChild(add);
  };
  draw();
}

// ---------- photos
function photoBlock(name) {
  const file = slug(name) + '.jpg';
  const has = D.photos.includes(file);
  return `<div class="row"><label>사진</label><div class="photo">
    ${has ? `<img src="/assets/photos/${file}?${Date.now()}">` : `<div class="none">없음</div>`}
    <div><code style="font-size:12px;color:var(--ink3)">assets/photos/${file}</code><br>
    <input type="file" accept="image/*" data-photo="${file}" style="font-size:12px;margin-top:4px">
    ${has ? `<button class="btn" data-delphoto="${file}" style="margin-top:4px">사진 삭제</button>` : ''}</div>
  </div></div>`;
}
function bindPhoto(card, rerender) {
  card.querySelectorAll('[data-photo]').forEach(inp => inp.addEventListener('change', async () => {
    const f = inp.files[0]; if (!f) return;
    const data = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); });
    setStatus('사진 업로드 중…');
    try { await api('/api/upload', {kind:'photo', name: inp.dataset.photo, data}); D.photos.push(inp.dataset.photo); setStatus('사진을 넣었습니다. 저장+빌드 시 480×640으로 자동 조정됩니다.', 'ok'); dirty = true; document.body.classList.add('dirty'); rerender(); }
    catch (e) { setStatus('업로드 실패: ' + e.message, 'err'); }
  }));
  card.querySelectorAll('[data-delphoto]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('사진을 삭제할까요?')) return;
    await api('/api/delete-photo', {name: b.dataset.delphoto}); D.photos = D.photos.filter(x => x !== b.dataset.delphoto); rerender();
  }));
}

// ---------- tabs
const MEMBER_FIELDS = [['en','영문 이름','text','placeholder="Gitae Park (논문 저자 표기와 동일하게)"'],['ko','한글 이름'],['course','과정·시작','text','placeholder="Graduate student (2024.03 ~)"'],['email','이메일'],['interest','관심분야']];
const MEMBER_BLANK = {en:'', ko:'', course:'Graduate student (20XX.03 ~)', email:'', interest:''};

function renderMembers(m) {
  const S = D.site;
  m.innerHTML = `<h1>Members</h1><p class="hint">영문 이름은 Publications의 저자 표기와 철자가 같아야 논문 목록이 자동으로 붙고 굵게 표시됩니다.</p>
    <h2>Professor</h2><div id="prof"></div>
    <h2>Graduate students</h2><div id="grad"></div>
    <h2>Undergraduate students</h2><div id="ug"></div>
    <h2>Alumni</h2><p class="hint">사진 없이 이름과 현 소속만 표시됩니다. 여기 이름도 논문 목록에서 굵게 처리됩니다.</p><div id="alumni"></div>`;
  // professor
  const P = S.professor, pc = $('#prof');
  const drawProf = () => {
    pc.innerHTML = `<div class="card prof">${photoBlock(P.en)}${[['en','영문 이름'],['ko','한글 이름'],['role','직함'],['email','이메일'],['office','Office'],['interest','관심분야','textarea']].map(f=>field(P,...f)).join('')}
      <div class="row"><label>Education</label><div class="sub" id="edu"></div></div>
      <div class="row"><label>Experience</label><div class="sub" id="exp"></div></div></div>`;
    bindFields(pc, P); bindPhoto(pc, drawProf);
    listEditor($('#edu'), P.education, [['date','기간'],['text','내용']], {date:'', text:''});
    listEditor($('#exp'), P.experience, [['date','기간'],['text','내용']], {date:'', text:''});
  };
  drawProf();
  const memberOpts = { extra: it => photoBlock(it.en || 'new'), after: (card, it, draw) => { bindPhoto(card, draw); card.querySelector('[data-k=en]').addEventListener('change', draw); } };
  listEditor($('#grad'), S.graduate, MEMBER_FIELDS, MEMBER_BLANK, memberOpts);
  listEditor($('#ug'), S.undergraduate, MEMBER_FIELDS, {...MEMBER_BLANK, course:'Undergraduate researcher (20XX.XX ~)'}, memberOpts);
  listEditor($('#alumni'), S.alumni, [['name','영문 이름'],['affiliation','현 소속']], {name:'', affiliation:''});
}

function renderPubs(m) {
  const Pb = D.pubs;
  m.innerHTML = `<h1>Publications</h1><p class="hint">저자에서 교신저자는 이름 앞에 <code>*</code>를 붙이세요 (예: <code>Gitae Park and *Kisong Lee</code>). Under Review / Early Access 항목의 저널 칸에는 상태(Under Major Revision 등)나 "저널명, Accepted"를 적습니다.</p>
    ${cvCard()}
    <div class="tools" style="justify-content:flex-start;margin-bottom:16px"><button id="addSec">+ 섹션(연도) 추가</button></div><div id="secs"></div>`;
  bindCv();
  const draw = () => {
    const box = $('#secs'); box.innerHTML = '';
    Pb.sections.forEach((sec, si) => {
      const items = Pb.items.filter(x => x.section === sec);
      const wrap = document.createElement('div'); wrap.className = 'pubsec';
      wrap.innerHTML = `<h2>${esc(sec)} <small>${items.length}편</small><span class="tools" style="margin:0"><button data-s="up" ${si===0?'disabled':''}>↑</button><button data-s="down" ${si===Pb.sections.length-1?'disabled':''}>↓</button><button data-s="rename">이름 변경</button><button data-s="del" class="del" ${items.length?'disabled title="비어 있을 때만 삭제 가능"':''}>삭제</button></span></h2><div class="list"></div>`;
      wrap.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
        const a = b.dataset.s;
        if (a === 'up') [Pb.sections[si-1], Pb.sections[si]] = [Pb.sections[si], Pb.sections[si-1]];
        if (a === 'down') [Pb.sections[si+1], Pb.sections[si]] = [Pb.sections[si], Pb.sections[si+1]];
        if (a === 'rename') { const n = prompt('섹션 이름', sec); if (!n) return; Pb.sections[si] = n; Pb.items.forEach(x => { if (x.section === sec) x.section = n; }); }
        if (a === 'del') Pb.sections.splice(si, 1);
        markDirty(); draw();
      });
      const list = wrap.querySelector('.list');
      items.forEach((it, i) => {
        const card = document.createElement('div'); card.className = 'card pub';
        card.innerHTML = field(it,'title','제목') + field(it,'authors','저자') + field(it,'venue','저널/상태') + field(it,'meta','IF 등','text','placeholder="IF2025: 8.4, Top 9.6%"') +
          `<div class="row"><label>섹션</label><select data-sec>${Pb.sections.map(s=>`<option ${s===sec?'selected':''}>${esc(s)}</option>`).join('')}</select></div>` + listTools(items, i);
        bindFields(card, it);
        card.querySelector('[data-sec]').onchange = e => { it.section = e.target.value; markDirty(); draw(); };
        card.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
          const gi = Pb.items.indexOf(it), a = b.dataset.act;
          if (a === 'del') { if (!confirm('삭제할까요?')) return; Pb.items.splice(gi, 1); }
          if (a === 'up') { const pi = Pb.items.indexOf(items[i-1]); [Pb.items[pi], Pb.items[gi]] = [Pb.items[gi], Pb.items[pi]]; }
          if (a === 'down') { const ni = Pb.items.indexOf(items[i+1]); [Pb.items[ni], Pb.items[gi]] = [Pb.items[gi], Pb.items[ni]]; }
          markDirty(); draw();
        });
        list.appendChild(card);
      });
      const add = document.createElement('button'); add.className = 'btn add'; add.textContent = '+ 이 섹션에 논문 추가';
      add.onclick = () => { const last = items.length ? Pb.items.indexOf(items[items.length-1]) + 1 : Pb.items.length; Pb.items.splice(last, 0, {section:sec, title:'', authors:'', venue:'', meta:''}); markDirty(); draw(); };
      list.appendChild(add);
      box.appendChild(wrap);
    });
  };
  draw();
  $('#addSec').onclick = () => { const n = prompt('섹션 이름 (예: 2027)'); if (!n) return; Pb.sections.splice(2, 0, n); markDirty(); draw(); };
}

function renderResearch(m) {
  m.innerHTML = `<h1>Research areas</h1><p class="hint">홈에 카드로 표시됩니다. 그림은 정사각형 권장, 800px 이상이면 빌드 시 자동 축소됩니다.</p><div id="res"></div>`;
  listEditor($('#res'), D.site.research, [['title','제목'],['text','설명','textarea']], {title:'', image:'', text:''}, {
    extra: it => `<div class="row"><label>그림</label><div class="photo">${it.image && D.research_images.includes(it.image) ? `<img src="/assets/research/${it.image}?${Date.now()}" style="height:60px;width:60px">` : `<div class="none" style="height:60px">없음</div>`}
      <div><select data-img><option value="">(선택)</option>${D.research_images.map(f=>`<option ${f===it.image?'selected':''}>${esc(f)}</option>`).join('')}</select>
      <input type="file" accept="image/*" data-rimg style="font-size:12px;margin-top:4px"></div></div></div>`,
    after: (card, it, draw) => {
      card.querySelector('[data-img]').onchange = e => { it.image = e.target.value; markDirty(); draw(); };
      card.querySelector('[data-rimg]').onchange = async e => {
        const f = e.target.files[0]; if (!f) return;
        const data = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); });
        const name = slug(f.name.replace(/\.[^.]+$/, '')) + '.jpg';
        try { await api('/api/upload', {kind:'research', name, data}); if (!D.research_images.includes(name)) D.research_images.push(name); it.image = name; markDirty(); draw(); }
        catch (err) { setStatus('업로드 실패: ' + err.message, 'err'); }
      };
    }
  });
}

function renderNews(m) {
  m.innerHTML = `<h1>News</h1><p class="hint">위에 있는 항목이 최신입니다. 홈의 Updates에는 상위 ${D.site.settings.home_updates}개가 제목만 표시됩니다.</p><div id="news"></div>`;
  listEditor($('#news'), D.site.news, [['label','표시 날짜','text','placeholder="Sep 2026"'],['date','정렬용 날짜','text','placeholder="2026-09"'],['title','제목'],['text','내용','textarea']], {label:'', date:'', title:'', text:''});
}

function renderSite(m) {
  const S = D.site;
  m.innerHTML = `<h1>Site text & settings</h1><div class="card" id="lab"></div><h2>Settings</h2><div class="card" id="set"></div>`;
  $('#lab').innerHTML = [['name','랩 이름'],['short','약칭'],['university','대학'],['tagline','홈 소개문','textarea'],['affiliation','소속 (홈)'],['address','주소 (푸터)'],['email','대표 이메일'],['recruitment','Recruitment 문단','textarea']].map(f=>field(S.lab,...f)).join('');
  bindFields($('#lab'), S.lab);
  const st = S.settings;
  $('#set').innerHTML = `<div class="row"><label>학부생 논문 표시</label><select data-k="show_undergrad_pubs"><option value="true" ${st.show_undergrad_pubs?'selected':''}>표시</option><option value="false" ${!st.show_undergrad_pubs?'selected':''}>숨김</option></select></div>
    <div class="row"><label>멤버당 논문 표시 수</label><input type="text" data-k="member_pubs_visible" value="${st.member_pubs_visible}"></div>
    <div class="row"><label>홈 Updates 개수</label><input type="text" data-k="home_updates" value="${st.home_updates}"></div>`;
  $('#set').querySelectorAll('[data-k]').forEach(i => i.addEventListener('change', () => {
    const k = i.dataset.k; st[k] = k === 'show_undergrad_pubs' ? i.value === 'true' : parseInt(i.value, 10) || 0; markDirty();
  }));
}

function render() {
  $('#nav').innerHTML = TABS.map(([k, l]) => `<button class="${k===tab?'on':''}" data-tab="${k}">${l}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); window.scrollTo(0,0); });
  const m = $('#content');
  ({members: renderMembers, pubs: renderPubs, research: renderResearch, news: renderNews, site: renderSite, github: renderGithub})[tab](m);
}

// ---------- save / build
async function saveBuild(quiet) {
  setStatus('저장하고 빌드하는 중…');
  try {
    await api('/api/save', {site: D.site, pubs: D.pubs, build: true});
    dirty = false; document.body.classList.remove('dirty');
    setStatus('저장 + 빌드 완료. 미리보기로 확인한 뒤 GitHub에 배포하세요.', 'ok');
    if (!quiet) {
      const box = document.createElement('div'); box.className = 'card';
      box.innerHTML = `<b>빌드 완료</b> — <a href="/" target="_blank">미리보기 ↗</a>에서 확인한 뒤 아래 <b>GitHub에 배포</b>를 누르면 사이트에 올라갑니다.`;
      $('#content').prepend(box); window.scrollTo(0,0);
    }
    D.photos = (await api('/api/data')).photos;
    await refreshStatus();
    return true;
  } catch (e) { setStatus('실패: ' + e.message, 'err'); return false; }
}
$('#save').onclick = () => saveBuild(false);
$('#reload').onclick = () => { if (!dirty || confirm('저장하지 않은 변경사항을 버릴까요?')) load(); };
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); $('#save').click(); } });

// ---------- professor's CV → publications
const cvDefault = () => (D.site.settings && D.site.settings.cv_publications_url) || D.cv_url;
const FIELD = {section:'섹션', authors:'저자', title:'제목', venue:'저널/상태', meta:'IF'};
function cvCard() {
  return `<div class="card" style="border-left:4px solid var(--accent);margin-bottom:18px">
    <b>교수님 CV와 맞추기</b>
    <p class="hint" style="margin:4px 0 8px">CV 사이트의 Publications 페이지를 읽어서 이 목록을 그대로 맞춥니다. 무엇이 바뀌는지 먼저 보여드리고, 확인한 뒤에 적용합니다.</p>
    <div class="row"><label>CV 주소</label><input type="text" id="cvUrl" value="${esc(cvDefault())}" spellcheck="false"></div>
    <div class="tools" style="justify-content:flex-start"><button class="btn primary" id="cvFetch">CV에서 가져오기</button><button id="cvPasteBtn">자동으로 안 될 때: 직접 붙여넣기</button></div>
    <div id="cvPaste" hidden><textarea id="cvText" style="min-height:140px" placeholder="CV의 Publications 페이지에서 Ctrl+A → Ctrl+C 한 내용을 여기에 붙여넣으세요"></textarea>
      <div class="tools" style="justify-content:flex-start"><button class="btn primary" id="cvRead">붙여넣은 내용 읽기</button></div></div>
    <div id="cvResult"></div>
  </div>`;
}
function bindCv() {
  $('#cvFetch').onclick = () => cvImport({url: $('#cvUrl').value.trim()});
  $('#cvPasteBtn').onclick = () => { $('#cvPaste').hidden = !$('#cvPaste').hidden; if (!$('#cvPaste').hidden) $('#cvText').focus(); };
  $('#cvRead').onclick = () => { const t = $('#cvText').value; if (t.trim()) cvImport({text: t}); };
}
async function cvImport(body) {
  const box = $('#cvResult'); box.innerHTML = '<p class="hint" style="margin:10px 0 0">CV를 읽는 중…</p>';
  setStatus('교수님 CV를 읽는 중…');
  try { const r = await api('/api/cv-import', {...body, current: D.pubs}); showCvDiff(r); setStatus('CV를 읽었습니다. 바뀌는 내용을 확인하세요.'); }
  catch (e) { box.innerHTML = `<div class="note err" style="margin:10px 0 0"><b>CV를 가져오지 못했습니다</b><p>${esc(e.message)}</p></div>`; setStatus('CV 가져오기 실패.', 'err'); }
}
function showCvDiff(r) {
  const d = r.diff, box = $('#cvResult');
  const counts = r.pubs.sections.map(s => `${esc(s)} ${d.counts[s]}`).join(' · ');   // keep page order (JS sorts numeric keys)
  let out = `<p style="margin:12px 0 4px"><b>CV에서 ${d.total}편을 읽었습니다</b><br><span class="hint">${counts}</span></p>`;
  if (d.same) { box.innerHTML = out + `<div class="note info" style="margin:8px 0 0"><b>랩 사이트 목록이 이미 CV와 같습니다</b><p>바꿀 것이 없습니다.</p></div>`; return; }
  if (d.total < d.current_total * 0.7) out += `<div class="note err" style="margin:8px 0"><b>읽은 논문 수가 지금(${d.current_total}편)보다 훨씬 적습니다</b><p>CV 페이지 구조가 바뀌었을 수 있습니다. 아래 내용을 꼭 확인하고, 이상하면 적용하지 마세요.</p></div>`;
  const val = v => v ? esc(v) : '(없음)';
  if (d.added.length) out += `<div class="dhead"><b>새 논문 ${d.added.length}편</b></div><ul class="dlist">${d.added.map(i => `<li><span class="k">${esc(i.section)}</span>${esc(i.title)}</li>`).join('')}</ul>`;
  if (d.changed.length) out += `<div class="dhead"><b>바뀐 논문 ${d.changed.length}편</b></div><ul class="dlist">${d.changed.map(c => {
      const sec = c.fields.find(f => f.field === 'section');
      return `<li><span class="k">${sec ? `${esc(sec.old)} → ${esc(sec.new)}` : '내용 수정'}</span>${esc(c.title)}${c.fields.filter(f => f.field !== 'section').map(f =>
        `<div class="chg">${FIELD[f.field]}: <s>${val(f.old)}</s> → ${val(f.new)}</div>`).join('')}</li>`; }).join('')}</ul>`;
  if (d.removed.length) out += `<div class="dhead"><b>CV에 없어서 빠지는 논문 ${d.removed.length}편</b></div><ul class="dlist">${d.removed.map(i => `<li><span class="k">${esc(i.section)}</span>${esc(i.title)}</li>`).join('')}</ul>`;
  if (d.reordered) out += `<p class="hint" style="margin:6px 0">논문 순서도 CV와 같게 바뀝니다.</p>`;
  out += `<div class="acts" style="display:flex;gap:8px;margin-top:10px"><button class="btn primary" id="cvApply">CV 내용으로 바꾸기</button><button class="btn" id="cvCancel">취소</button></div>`;
  box.innerHTML = out;
  $('#cvCancel').onclick = () => { box.innerHTML = ''; setStatus(''); };
  $('#cvApply').onclick = () => {
    D.pubs = r.pubs;
    const url = $('#cvUrl').value.trim();
    if (url && r.source === url && url !== cvDefault()) D.site.settings.cv_publications_url = url;   // remember a changed CV address
    markDirty(); render(); window.scrollTo(0, 0);
    note('info', `<b>논문 목록을 CV와 맞췄습니다</b><p>새 논문 ${d.added.length} · 바뀐 논문 ${d.changed.length} · 빠진 논문 ${d.removed.length}. <b>저장 + 빌드</b>로 미리보기를 확인한 뒤 <b>GitHub에 배포</b>하세요.</p>`);
    setStatus('CV 내용으로 바꿨습니다. 저장 + 빌드 후 배포하세요.', 'ok');
  };
}

// ---------- GitHub: status, sync, deploy
const short = s => (s || '').slice(0, 7);
const when = iso => { try { return new Date(iso).toLocaleString('ko-KR', {dateStyle:'medium', timeStyle:'short'}); } catch { return iso || ''; } };
const KIND = {added:'추가', modified:'수정', deleted:'삭제', 'local-only':'이 폴더만', 'remote-only':'GitHub만', different:'내용 다름'};
const fileList = items => `<ul class="flist">${items.map(it => typeof it === 'string' ? `<li>${esc(it)}</li>` : `<li><span class="k">${KIND[it.kind] || it.kind}</span>${esc(it.path)}</li>`).join('')}</ul>`;

function note(cls, html, dismissable = true) {
  const n = document.createElement('div'); n.className = 'note ' + cls;
  n.innerHTML = (dismissable ? '<button class="x" title="닫기">×</button>' : '') + html;
  n.querySelector('.x')?.addEventListener('click', () => n.remove());
  $('#notice').appendChild(n); return n;
}

async function refreshStatus() {
  try { S = await api('/api/status'); } catch { return; }
  const chip = $('#sync'), n = S.pending ? S.pending.length : 0;
  if (!S.head) { chip.className = 'chip warn'; chip.textContent = S.report && S.report.first_run ? '첫 동기화 선택 필요' : 'GitHub 연결 안 됨 · 로컬 작업'; }
  else if (n) { chip.className = 'chip warn'; chip.textContent = `배포 대기 ${n}개 · 기준 ${short(S.head.sha)}`; }
  else { chip.className = 'chip ok'; chip.textContent = `GitHub과 같음 · ${short(S.head.sha)}`; }
  if (S.report && !S.report.ok && S.head) { chip.className = 'chip off'; chip.textContent = `오프라인 · 기준 ${short(S.head.sha)}`; }
  chip.title = S.head ? `GitHub 기준 커밋 ${short(S.head.sha)} "${S.head.message}" (${S.head.author}, ${when(S.head.date)})\n마지막 동기화: ${when(S.synced_at)}` : '';
  const dep = $('#deploy');
  dep.textContent = n ? `GitHub에 배포 (${n})` : 'GitHub에 배포';
  dep.disabled = !S.head;
  if (tab === 'github') renderGithub($('#content'));
}

function showReport(rep) {
  if (!rep) return;
  if (!rep.ok) {
    note('err', `<b>GitHub과 동기화하지 못했습니다</b><p>${esc(rep.error || '')}</p><p>지금은 이 폴더의 파일로 작업합니다. 인터넷 연결을 확인한 뒤 위의 <b>최신 받기</b>를 눌러 다시 시도하세요.</p>`);
    return;
  }
  const h = rep.head;
  if (rep.first_run) {
    const n = note('warn', `<b>처음 실행: 이 폴더와 GitHub이 ${rep.diffs.length}개 파일에서 다릅니다</b>
      <p>GitHub 최신 버전: ${short(h.sha)} “${esc(h.message)}” (${esc(h.author)}, ${when(h.date)})</p>
      <p>GitHub에서 방금 받은 폴더라면 <b>GitHub 버전으로 맞추기</b>를, 이 폴더에 아직 배포하지 않은 작업이 있다면 <b>이 폴더 유지</b>를 고르세요. 바뀌는 파일은 <code>_backup/</code>에 먼저 보관됩니다.</p>
      ${fileList(rep.diffs)}
      <div class="acts"><button class="btn primary" data-m="take-remote">GitHub 버전으로 맞추기</button><button class="btn" data-m="keep-local">이 폴더 유지 (나중에 배포)</button></div>`, false);
    n.querySelectorAll('[data-m]').forEach(b => b.onclick = () => runSync(b.dataset.m, n));
    return;
  }
  if (rep.token_invalid) note('warn', `<b>GitHub 토큰이 만료되었거나 잘못되었습니다</b><p>받기는 토큰 없이 했지만, 배포하려면 <b>GitHub 배포</b> 탭에서 새 토큰으로 다시 연결하세요.</p>`);
  const got = rep.updated.length + rep.deleted.length;
  if (rep.conflicts.length) {
    note('warn', `<b>다른 사람이 먼저 배포한 파일과 겹쳐서 GitHub 버전으로 바꿨습니다</b>
      <p>내 버전은 <code>${esc(rep.backup)}/</code> 폴더에 보관했습니다. 필요한 내용은 다시 입력한 뒤 배포하세요.</p>${fileList(rep.conflicts)}`);
  }
  if (got && rep.conflicts.length < got) {
    note('info', `<b>GitHub에서 최신 버전을 받아왔습니다 (${got}개 파일)</b>
      <p>${short(h.sha)} “${esc(h.message)}” — ${esc(h.author)}, ${when(h.date)}</p>${fileList([...rep.updated, ...rep.deleted].filter(p => !rep.conflicts.includes(p)))}`);
  }
}

async function runSync(mode, noteEl) {
  setStatus('GitHub과 동기화하는 중…');
  try {
    const r = await api('/api/sync', {mode});
    noteEl?.remove(); $('#notice').innerHTML = '';
    if ((r.report.updated || []).includes('admin/index.html')) { location.reload(); return; }   // the editor itself was updated
    showReport(r.report); await load(); await refreshStatus();
    setStatus('동기화 완료.', 'ok');
  } catch (e) { $('#notice').innerHTML = ''; showReport(e.data && e.data.report); setStatus('동기화 실패: ' + e.message, 'err'); await refreshStatus(); }
}

$('#pull').onclick = () => {
  if (dirty && !confirm('저장하지 않은 편집이 있습니다. 버리고 GitHub 최신 버전을 받을까요?\n(취소하고 먼저 "저장 + 빌드"를 누르면 편집이 유지됩니다)')) return;
  const n = S && S.pending ? S.pending.length : 0;
  if (n && !confirm(`배포하지 않은 변경 ${n}개가 있습니다. 다른 사람이 같은 파일을 바꿨다면 GitHub 버전으로 바뀌고 내 버전은 _backup/ 에 보관됩니다. 계속할까요?`)) return;
  runSync('auto');
};

$('#deploy').onclick = async () => {
  if (!S || !S.login) { tab = 'github'; render(); setStatus('배포하려면 먼저 GitHub 토큰을 연결하세요.', 'err'); return; }
  if (dirty && !(await saveBuild(true))) return;
  await refreshStatus();
  const n = S.pending ? S.pending.length : 0;
  if (!n) { setStatus('배포할 변경이 없습니다. GitHub과 같습니다.', 'ok'); return; }
  const msg = prompt(`${n}개 파일을 GitHub에 배포합니다. 이번 변경을 한 줄로 적어주세요 (기록용).`, '사이트 업데이트');
  if (msg === null) return;
  setStatus('GitHub에 배포하는 중…'); $('#deploy').disabled = true;
  try {
    const r = await api('/api/deploy', {message: msg});
    $('#notice').innerHTML = '';
    if (r.nothing) note('info', `<b>배포할 변경이 없습니다</b><p>GitHub과 같은 상태입니다.</p>`);
    else note('info', `<b>배포 완료 (${r.files.length}개 파일)</b>
      <p>1~2분 뒤 <a href="${esc(r.site_url)}" target="_blank">${esc(r.site_url)}</a> 에 반영됩니다. 바로 안 보이면 Ctrl+Shift+R로 새로고침하세요.</p>
      <p><a href="${esc(r.commit_url)}" target="_blank">GitHub에서 이번 커밋 보기 ↗</a>${r.pulled.length ? ` · 배포 전에 다른 사람의 변경 ${r.pulled.length}개를 함께 받았습니다.` : ''}</p>${fileList(r.files)}`);
    setStatus('배포 완료.', 'ok');
    if (r.pulled && r.pulled.length) await load();
  } catch (e) {
    const d = e.data || {};
    $('#notice').innerHTML = '';
    if (d.code === 'conflict') note('err', `<b>배포하지 못했습니다: 다른 사람이 같은 파일을 먼저 배포했습니다</b>
      <p>아무것도 바뀌지 않았습니다. 위의 <b>최신 받기</b>를 누르면 GitHub 버전으로 맞춰지고 내 버전은 <code>_backup/</code>에 보관됩니다. 그다음 내 수정을 다시 입력해서 배포하세요.</p>${fileList(d.files || [])}`);
    else note('err', `<b>배포하지 못했습니다</b><p>${esc(e.message)}</p>`);
    setStatus('배포 실패.', 'err');
  }
  await refreshStatus(); window.scrollTo(0, 0);
};

function renderGithub(m) {
  const s = S || {};
  const tokenUrl = 'https://github.com/settings/personal-access-tokens/new?' + new URLSearchParams({
    name: s.token_name || 'WInLab admin', description: `WIn Lab admin page: deploy ${s.repo || ''}`,
    target_name: (s.repo || 'winlab-skku/').split('/')[0], expires_in: '366', contents: 'write'}).toString();
  const pend = s.pending || [];
  m.innerHTML = `<h1>GitHub 배포</h1>
    <p class="hint">저장소 <a href="https://github.com/${esc(s.repo)}" target="_blank">${esc(s.repo)}</a> · 사이트 <a href="${esc(s.site_url)}" target="_blank">${esc(s.site_url)}</a></p>
    <h2>이 폴더의 상태</h2>
    <div class="card">
      ${s.head ? `<div class="row"><label>GitHub 기준</label><div style="padding-top:6px">${short(s.head.sha)} “${esc(s.head.message)}” — ${esc(s.head.author)}, ${when(s.head.date)}</div></div>
      <div class="row"><label>마지막 동기화</label><div style="padding-top:6px">${when(s.synced_at)}</div></div>` : `<p class="hint" style="margin:0">아직 GitHub과 동기화하지 않았습니다.</p>`}
      <div class="row"><label>배포 대기</label><div style="padding-top:6px">${pend.length ? `${pend.length}개 파일 ${fileList(pend)}` : '없음 — GitHub과 같습니다'}</div></div>
      <div class="tools" style="justify-content:flex-start"><button id="gPull">최신 받기</button></div>
    </div>
    <h2>GitHub 연결 (배포용 토큰)</h2>
    <div class="card" id="tok">
      ${s.login ? `<p style="margin:0">연결됨: <b>@${esc(s.login)}</b> — 이 PC에서 배포할 수 있습니다.</p>
        <p class="hint" style="margin:6px 0 0">토큰 저장 위치: <code>${esc(s.token_file)}</code> (프로젝트 폴더 밖이라 GitHub에 올라가지 않습니다)</p>
        <div class="tools" style="justify-content:flex-start"><button id="tokNew">다른 토큰으로 바꾸기</button><button id="tokClear" class="del">연결 해제</button></div>`
      : `<p style="margin:0 0 6px">배포하려면 PC마다 한 번, GitHub 토큰을 연결해야 합니다.</p>
        <ol class="steps">
          <li><a href="${esc(tokenUrl)}" target="_blank"><b>토큰 만들기 페이지 열기 ↗</b></a> (이름·권한이 미리 채워져 있습니다. GitHub 로그인 필요)</li>
          <li><b>Repository access</b>에서 <b>Only select repositories</b> → <code>${esc((s.repo || '').split('/')[1] || '')}</code> 선택</li>
          <li><b>Permissions</b>에 <b>Contents: Read and write</b>가 있는지 확인 → 맨 아래 <b>Generate token</b></li>
          <li>나온 토큰(<code>github_pat_…</code>)을 복사해서 아래에 붙여넣고 <b>연결</b></li>
        </ol>
        <div class="row" style="margin-top:12px"><label>토큰</label><input type="text" id="tokIn" placeholder="github_pat_..." autocomplete="off" spellcheck="false"></div>
        <div class="tools"><button class="btn primary" id="tokSave">연결</button></div>
        <p class="hint" style="margin:8px 0 0">토큰은 이 PC의 <code>${esc(s.token_file || '')}</code>에만 저장되고 GitHub 저장소에는 올라가지 않습니다. 유효기간(최대 1년)이 끝나면 같은 방법으로 새로 만들어 연결하세요.
        조직(winlab-skku)의 Owner가 아니면 토큰이 조직 승인 대기 상태가 될 수 있습니다 — Owner가 조직 Settings → Personal access tokens에서 승인하면 됩니다.</p>`}
    </div>`;
  $('#gPull').onclick = () => $('#pull').click();
  const save = async () => {
    const t = $('#tokIn').value.trim(); if (!t) return;
    setStatus('토큰 확인 중…');
    try { const r = await api('/api/token', {token: t}); setStatus(`연결됨: @${r.login}`, 'ok'); if (r.warning) alert(r.warning); await refreshStatus(); }
    catch (e) { setStatus('연결 실패: ' + e.message, 'err'); }
  };
  if ($('#tokSave')) { $('#tokSave').onclick = save; $('#tokIn').onkeydown = e => { if (e.key === 'Enter') save(); }; }
  if ($('#tokClear')) $('#tokClear').onclick = async () => { if (!confirm('이 PC에서 GitHub 연결을 해제할까요?')) return; await api('/api/token', {token: ''}); await refreshStatus(); };
  if ($('#tokNew')) $('#tokNew').onclick = () => { S.login = null; renderGithub(m); };
}

(async () => { await load(); await refreshStatus(); if (S) showReport(S.report); })();
</script>
</body>
</html>
